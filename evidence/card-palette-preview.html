<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>四套卡牌配色对照 · 夜渡</title>
  <link rel="stylesheet" href="../src/style.css"/>
  <style>
    html,body { height: auto; min-height: 100%; overflow: auto; }
    body { padding: 24px; }
    main { max-width: 1000px; margin: 0 auto; }
    h1 { margin: 0 0 8px; color: #ecdfc5; font-size: 26px; }
    .intro { margin: 0 0 22px; color: #c8c5b6; font-size: 14px; }
    .palette { display: grid; grid-template-columns: repeat(4,minmax(0,1fr)); gap: 20px; }
    figure { margin: 0; min-width: 0; }
    figcaption { margin: 0 0 10px; color: #ece0c5; text-align: center; font-size: 18px; }
    .palette .full-card { width: 100%; }
    .link { display: inline-block; margin-top: 20px; color: #c5d6ca; }
    @media(max-width:700px) { .palette { grid-template-columns: repeat(2,minmax(0,1fr)); gap: 18px; } }
  </style>
</head>
<body>
<main>
  <h1>四套卡牌配色</h1>
  <p class="intro">朱砂 · 青玉 · 靛蓝 · 绛紫　｜　框、背景、物件、费用四层独立</p>
  <section class="palette" aria-label="四套卡牌配色对照"></section>
  <a class="link" href="/">返回试玩</a>
</main>
<script type="module">
  import { CARD_DEFS } from '../src/engine.js';
  import { CARD_FAMILIES, getCardVisual } from '../src/card-visuals.js';
  const examples = ['brush', 'talisman', 'bell', 'chain'];
  const colorNames = ['朱砂', '青玉', '靛蓝', '绛紫'];
  const asset = name => new URL(`../public/assets/${name}.png`, import.meta.url).href;
  document.querySelector('.palette').innerHTML = CARD_FAMILIES.map((family, index) => {
    const card = CARD_DEFS[examples[index]], visual = getCardVisual(card.id);
    const frame = `<img src="${asset(visual.frame)}" alt="" draggable="false"/>`;
    return `<figure><figcaption>${colorNames[index]} · ${family.label}</figcaption><article class="full-card ${card.type}" data-card-id="${card.id}" data-card-family="${family.id}" aria-label="${family.label}卡牌示例"><span class="card-picture" aria-hidden="true"><img class="card-background" data-card-layer="background" src="${asset(visual.background)}" alt=""/><img class="card-art" data-card-layer="icon" src="${asset(visual.icon)}" alt=""/></span><span class="card-frame" data-card-layer="frame" aria-hidden="true">${frame.repeat(3)}</span><span class="card-cost" data-card-layer="cost"><img class="card-cost-art" src="${asset(visual.cost)}" alt=""/><span class="card-cost-number">${card.cost}</span></span><h3 class="card-name">${card.name}</h3><small class="card-type">${family.label} · ${card.type === 'attack' ? '攻击' : '术法'}</small><p class="card-description">${card.description}</p></article></figure>`;
  }).join('');
</script>
</body>
</html>
