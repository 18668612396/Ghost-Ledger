<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>v0.5 受控交互场景</title>
<h1>受控交互验证</h1>
<p>仅用于验证生产界面。这里修改测试初始条件，不代表正常冒险难度；页面不进入静态构建。只允许在独立测试站点 127.0.0.2 使用。</p>
<button data-scenario="choice">必选牌与消耗组合</button>
<button data-scenario="five">五怪与群攻</button>
<button data-scenario="victory">首领胜利结算</button>
<button data-scenario="defeat">阴债失败结算</button>
<p id="result" role="status"></p>
<script type="module">
import { CONTENT, createAdventure, transition, isValidSave, getAvailableNodes } from '../src/engine.js';
import { makeCard } from '../src/runtime/effects.js';
import { createConfiguredEnemy, planConfiguredIntent } from '../src/runtime/world.js';
document.addEventListener('click', event => {
  const scenario = event.target.dataset.scenario; if (!scenario) return;
  if (location.hostname !== '127.0.0.2') { document.querySelector('#result').textContent = '请通过 http://127.0.0.2:4210/evidence/v05-scenarios.html 使用，避免覆盖正常试玩存档。'; return; }
  let run = createAdventure(412, { runId: `ui-scenario-${scenario}-${Date.now()}` });
  run = transition(run, { type: 'selectNode', nodeId: getAvailableNodes(run)[0].id });
  const ids = scenario === 'five' ? ['gremlin_mad', 'gremlin_sneaky', 'gremlin_wizard', 'gremlin_shield', 'gremlin_fat'] : [scenario === 'victory' ? 'guardian' : 'cultist'];
  run.enemies = ids.map((id, i) => createConfiguredEnemy(id, run, i, CONTENT, () => .4));
  for (const enemy of run.enemies) enemy.intent = planConfiguredIntent(run, enemy, CONTENT, () => .4);
  const cards = scenario === 'choice' ? ['ic_armaments', 'ic_burning_pact', 'ic_true_grit', 'ic_defend', 'ic_strike'] : scenario === 'five' ? ['ic_cleave', 'ic_whirlwind', 'ic_defend', 'debt_chain', 'debt_ledger'] : ['ic_strike', 'ic_defend'];
  run.hand = cards.map(id => makeCard(run, id));
  run.drawPile = ['ic_defend', 'ic_strike', 'ic_shrug_it_off'].map(id => makeCard(run, id)); run.discard = []; run.energy = 8;
  if (scenario === 'victory') { run.encounterKind = 'boss'; run.enemies[0].hp = 1; }
  if (scenario === 'defeat') { run.hp = 1; run.debts = [{ id: 'qa-debt', amount: 1, dueTurn: run.turn + 1, originalDueTurn: run.turn + 1, delayed: false }]; }
  if (!isValidSave(run)) { document.querySelector('#result').textContent = '场景校验失败，未保存。'; return; }
  localStorage.setItem('ghost-ledger.run.v4', JSON.stringify(run));
  location.assign('/');
});
</script>
</html>
